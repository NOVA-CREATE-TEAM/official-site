<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Dashboard | vocalink-team</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0b0d0c;--card:#141816;--line:#29302c;--text:#edf2ee;--muted:#8d9891;--ok:#74d69b;--warn:#e8c66d;--bad:#ee7777}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1d2923,transparent 35%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{width:min(1200px,calc(100% - 32px));margin:auto}.top{padding:34px 0 20px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.08em}.sub{color:var(--muted);margin-top:8px}.auth{max-width:420px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}.auth h1{margin-top:0}.input{width:100%;padding:13px;margin:7px 0 10px;background:#0b0e0c;border:1px solid var(--line);border-radius:10px;color:var(--text)}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:800;background:#e8eee9;color:#101411}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat,.panel{background:#121613;border:1px solid var(--line);border-radius:16px}.stat{padding:20px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.value{font-size:32px;font-weight:800;margin-top:8px}.panel{padding:20px;margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.live{color:var(--ok);font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-top:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-size:11px}.sev{font-weight:800}.critical,.high{color:var(--bad)}.medium{color:var(--warn)}.low{color:var(--ok)}.muted{color:var(--muted)}.logout{float:right}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.table{font-size:12px}.table th:nth-child(4),.table td:nth-child(4){display:none}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.value{font-size:24px}}</style></head><body><div id="login" class="auth"><h1>Security Dashboard</h1><p class="muted">管理者専用。vocalink-teamの管理者アカウントでログインしてください。</p><input id="email" class="input" type="email" placeholder="メールアドレス"><input id="password" class="input" type="password" placeholder="パスワード"><button id="loginBtn">ログイン</button><p id="loginMsg" class="muted"></p></div><main id="app" class="hidden"><header class="top"><div class="wrap"><button class="logout" id="logoutBtn">ログアウト</button><div class="brand">vocalink-team / SECURITY</div><div class="sub">Security Dashboard · 5秒ごとに更新</div></div></header><div class="wrap"><section class="grid"><div class="stat"><div class="label">Events / 1h</div><div id="events" class="value">—</div></div><div class="stat"><div class="label">High / Critical</div><div id="high" class="value">—</div></div><div class="stat"><div class="label">DDoS Signals</div><div id="ddos" class="value">—</div></div><div class="stat"><div class="label">Unique IPs</div><div id="ips" class="value">—</div></div></section><section class="panel"><div class="panel-head"><h2>最新セキュリティイベント</h2><span class="live">● LIVE</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>発生時刻</th><th>危険度</th><th>種類</th><th>IP</th><th>対象</th><th>リクエスト数</th><th>状態</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">読み込み中…</td></tr></tbody></table></div></section></div></main><script>const SUPABASE_URL='https://nambmvqtpktwhwcethbi.supabase.co';const SUPABASE_KEY='sb_publishable_YNmyLuQv9f8Kk5v5GVNPdA_Cyd_1432';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);async function load(){const {data,error}=await db.from('security_dashboard').select('*').single();if(error){$('loginMsg').textContent='権限がありません。管理者権限を確認してください。';return}$('events').textContent=data.events_last_hour??0;$('high').textContent=data.high_events_last_hour??0;$('ddos').textContent=data.ddos_events_last_hour??0;$('ips').textContent=data.unique_ips_last_hour??0;const r=await db.from('security_events').select('id,created_at,severity,event_type,ip_address,path,request_count,resolved').order('created_at',{ascending:false}).limit(100);if(r.error)return;$('rows').innerHTML=r.data.length?r.data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('ja-JP')}</td><td class="sev ${x.severity}">${x.severity.toUpperCase()}</td><td>${x.event_type}</td><td>${x.ip_address||'—'}</td><td>${x.path||'—'}</td><td>${x.request_count??'—'}</td><td>${x.resolved?'解決済み':'未対応'}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">イベントはありません</td></tr>'}async function session(){const {data}=await db.auth.getSession();if(data.session){const role=data.session.user.app_metadata?.role;if(role!=='admin'){await db.auth.signOut();$('loginMsg').textContent='管理者アカウントではありません。';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load();setInterval(load,5000)}}$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent='ログインに失敗しました。メールアドレスまたはパスワードを確認してください。';return}session()};$('logoutBtn').onclick=()=>db.auth.signOut().then(()=>location.reload());db.auth.onAuthStateChange(()=>session());session();</script></body></html>
