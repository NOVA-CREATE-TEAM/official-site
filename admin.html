<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruit Admin | NOVA-CREATE-TEAM</title><style>body{margin:0;background:#11100e;color:#f2eee6;font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid #39352e}.logo{font-weight:850}.logo span{color:#b7a08a}main{padding:55px 0}.k{color:#8fa6a0;font-size:10px;letter-spacing:.2em;font-weight:800}h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.07em;margin:12px 0 30px}.panel{border:1px solid #39352e;border-radius:18px;padding:25px;background:#ffffff04;margin-bottom:25px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #39352e;border-radius:10px;background:#151411;color:#f2eee6;margin:7px 0 12px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#e7dfd3;color:#171512;font-weight:800;cursor:pointer}.danger{background:#342020;color:#f0b7b7}.msg{color:#aaa398;font-size:13px;margin-top:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:13px;border-bottom:1px solid #39352e;vertical-align:top;font-size:12px}th{color:#8fa6a0;font-size:10px;letter-spacing:.1em}td{color:#c8c1b7;white-space:pre-wrap}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><header><div class="wrap"><a class="logo" href="recruit.html">NOVA<span>-CREATE-TEAM</span></a></div></header><main><div class="wrap"><div class="k">ADMIN / RECRUITMENT</div><h1>APPLICANTS.</h1><section id="login" class="panel"><h2>管理者ログイン</h2><p>Supabase Authで登録された管理者アカウントでログインしてください。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">ログイン</button><div id="loginMsg" class="msg"></div></section><section id="dashboard" class="hidden"><div class="panel"><div class="top"><div><div class="k">APPLICATIONS</div><h2>応募者一覧</h2></div><button class="btn danger" id="logout">ログアウト</button></div><div id="status" class="msg"></div></div><div class="panel table-wrap"><table><thead><tr><th>応募日時</th><th>氏名</th><th>メール</th><th>Discord</th><th>年齢</th><th>希望ポジション</th><th>経験・スキル</th><th>ポートフォリオ</th><th>応募理由</th><th>活動可能時間</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://qvxoxrzvxyyribqjnpkb.supabase.co','sb_publishable_1zOA0YpTtJkNYsmm4zXxsA_wSJpdHKe');const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),lm=document.querySelector('#loginMsg'),status=document.querySelector('#status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const{data,error}=await sb.from('team_applications').select('*').order('created_at',{ascending:false});if(error){status.textContent='応募者一覧を取得できませんでした。管理者権限を確認してください。';return}document.querySelector('#rows').innerHTML=data.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('ja-JP'))}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.discord)}</td><td>${esc(x.age)}</td><td>${esc(x.role)}</td><td>${esc(x.experience)}</td><td>${x.portfolio_url?`<a href="${esc(x.portfolio_url)}" target="_blank" rel="noopener">開く</a>`:''}</td><td>${esc(x.motivation)}</td><td>${esc(x.availability)}</td></tr>`).join('')}async function session(){const{data}=await sb.auth.getSession();if(data.session){login.classList.add('hidden');dash.classList.remove('hidden');await load()}}document.querySelector('#loginBtn').onclick=async()=>{lm.textContent='ログイン中...';const{error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error){lm.textContent='ログインに失敗しました。メールアドレス・パスワードを確認してください。';return}await session()};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};session();</script></body></html>
