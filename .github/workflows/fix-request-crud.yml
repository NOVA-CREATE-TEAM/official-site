name: Fix service request CRUD
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-request-crud.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin CRUD
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<th>受付日時</th><th>依頼者</th><th>カテゴリ</th><th>タイトル</th><th>予算</th><th>納期</th><th>急ぎ</th><th>ステータス</th>', '<th>受付日時</th><th>依頼者</th><th>カテゴリ</th><th>タイトル</th><th>予算</th><th>納期</th><th>急ぎ</th><th>ステータス</th><th>操作</th>')
          s=s.replace('colspan="8" class="empty">制作依頼はありません。', 'colspan="9" class="empty">制作依頼はありません。')
          new_render='''function renderRequests(list){$('#requestRows').innerHTML=list.length?list.map(r=>`<tr><td>${esc(new Date(r.created_at).toLocaleString('ja-JP'))}</td><td>${esc(r.name)}<br><span class="msg">${esc(r.email)}</span></td><td>${esc(r.category)}</td><td><a href="#" class="request-link" data-id="${esc(r.id)}">${esc(r.title)}</a></td><td>${esc(r.budget)}</td><td>${esc(r.deadline)}</td><td>${r.urgent?'はい':'—'}</td><td><select class="request-status" data-id="${esc(r.id)}">${['new','reviewing','quoted','contracted','in_progress','completed','rejected'].map(st=>`<option value="${st}" ${r.status===st?'selected':''}>${st}</option>`).join('')}</select><span class="request-msg msg" data-id="${esc(r.id)}"></span></td><td><button class="btn" data-request-edit="${esc(r.id)}">詳細・編集</button> <button class="btn danger" data-request-delete="${esc(r.id)}">削除</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">制作依頼はありません。</td></tr>';$$('.request-link').forEach(a=>a.onclick=e=>{e.preventDefault();openRequest(requests.find(r=>String(r.id)===String(a.dataset.id)))});$$('.request-status').forEach(x=>x.onchange=()=>updateRequestStatus(x.dataset.id,x.value));$$('[data-request-edit]').forEach(b=>b.onclick=()=>openRequest(requests.find(r=>String(r.id)===String(b.dataset.requestEdit))));$$('[data-request-delete]').forEach(b=>b.onclick=()=>deleteRequest(b.dataset.requestDelete))}'''
          pat=r'function renderRequests\(list\)\{.*?\}\nfunction openRequest'
          s,n=re.subn(pat,new_render+'\nfunction openRequest',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'renderRequests patch target not found: {n}')
          helper='''async function updateRequestStatus(id,status){const msg=$(`.request-msg[data-id="${id}"]`);if(msg)msg.textContent=' 保存中...';const{data,error}=await sb.rpc('admin_update_service_request',{p_id:id,p_status:status,p_admin_note:null});if(error){console.error('request status update error:',error);if(msg)msg.textContent=' 保存失敗: '+error.message;return}const item=requests.find(x=>String(x.id)===String(id));if(item)item.status=data?.status||status;if(msg){msg.textContent=' 保存しました';setTimeout(()=>msg.textContent='',1800)}}
          async function deleteRequest(id){if(!confirm('この制作依頼を完全に削除します。削除後は元に戻せません。続行しますか？'))return;const{error}=await sb.rpc('admin_delete_service_request',{p_id:id});if(error){alert('削除に失敗しました: '+error.message);return}requests=requests.filter(x=>String(x.id)!==String(id));renderRequests(requests);$('#requestModal').classList.remove('open')}'''
          marker='function openRequest(r){'
          if helper not in s: s=s.replace(marker,helper+'\n'+marker,1)
          old=r"\$\('#saveRequest'\)\.onclick=async\(\)=>\{.*?\};\$\('#deleteRequest'\)\.onclick=async\(\)=>\{.*?\}"
          replacement="$('#saveRequest').onclick=async()=>{const{data,error}=await sb.rpc('admin_update_service_request',{p_id:r.id,p_status:$('#editStatus').value,p_admin_note:$('#editNote').value});if(error){console.error('service request update error:',error);$('#saveMsg').textContent=`保存に失敗しました: ${error.message}`;return}r.status=data?.status||$('#editStatus').value;r.admin_note=data?.admin_note||$('#editNote').value;$('#saveMsg').textContent=' 保存しました。';await loadRequests()};$('#deleteRequest').onclick=async()=>{await deleteRequest(r.id)}"
          s,n=re.subn(old,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'openRequest CRUD patch target not found: {n}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'vocalink-team'
          git config user.email 'vocalink.team@gmail.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'fix: make service request status and delete controls explicit'
          git push
