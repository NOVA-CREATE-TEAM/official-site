name: Fix admin request status
on:
  push:
    paths:
      - '.github/workflows/fix-admin-request-status.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('admin.html')
          s = p.read_text()
          pattern = r"const\{error\}=await sb\.from\('service_requests'\)\.update\(\{status:\$\('#editStatus'\)\.value,admin_note:\$\('#editNote'\)\.value\}\)\.eq\('id',r\.id\);if\(error\)\{\$\('#saveMsg'\)\.textContent=`保存に失敗しました: \$\{error\.message\}`;return\}\$\('#saveMsg'\)\.textContent=' 保存しました。';await loadRequests\(\)"
          replacement = "const{data,error}=await sb.from('service_requests').update({status:$('#editStatus').value,admin_note:$('#editNote').value}).eq('id',r.id).select('id,status,admin_note').single();if(error){console.error('service request update error:',error);$('#saveMsg').textContent=`保存に失敗しました: ${error.message}`;return}r.status=data.status;r.admin_note=data.admin_note;$('#saveMsg').textContent=' 保存しました。';await loadRequests()"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'update target not found: {n}')
          p.write_text(s2)
          print('admin.html patched')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: verify service request status updates [skip ci]'
          git push
