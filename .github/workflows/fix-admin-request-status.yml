name: Finish admin status fix
on:
  push:
    paths:
      - '.github/workflows/fix-admin-request-status.yml'
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump official site version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          v=Path('VERSION.json')
          d=json.loads(v.read_text())
          d['version']='v1.1.1'
          d['updated']='2026-09-02'
          if not any('ステータス保存処理を強化' in x for x in d.get('changes', [])):
              d['changes'].insert(0,'制作依頼のステータス保存処理を強化し、更新結果を検証するよう修正')
          v.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          i=Path('index.html')
          t=i.read_text()
          t=t.replace('v1.1.0','v1.1.1').replace('content=\"1.1.0\"','content=\"1.1.1\"')
          i.write_text(t)
          PY
      - name: Commit version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: bump official site to v1.1.1 [skip ci]'
          git push
