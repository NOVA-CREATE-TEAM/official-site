<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="vocalink-team 制作依頼フォーム"><title>制作依頼 | vocalink-team</title><link rel="stylesheet" href="request.css?v=1.0.0"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><a href="index.html">vocalink<span>-team</span></a><a href="index.html">← HOME</a></header><main><div class="eyebrow">SERVICE REQUEST</div><h1>制作依頼<span>.</span></h1><p class="intro">Webサイト・Webアプリ・大会管理システムなど、制作についてお気軽にご相談ください。</p><form id="requestForm"><section><h2>01 / CONTACT</h2><div class="grid"><label>お名前 *<input id="name" maxlength="100" required></label><label>企業・団体名<input id="organization" maxlength="200"></label><label>メールアドレス *<input id="email" type="email" maxlength="320" required></label><label>電話番号<input id="phone" type="tel" maxlength="30"></label></div><label>希望連絡方法 *<select id="contact_method"><option value="email">メール</option><option value="phone">電話</option></select></label></section><section><h2>02 / PROJECT</h2><label>依頼カテゴリ *<select id="category" required><option value="">選択してください</option><option>Webサイト制作</option><option>Webアプリ制作</option><option>大会管理サイト</option><option>システム開発</option><option>デザイン制作</option><option>その他</option></select></label><label>依頼タイトル *<input id="title" maxlength="200" placeholder="例：大会管理サイトを作りたい" required></label><label>依頼内容・実現したいこと *<textarea id="description" maxlength="10000" required placeholder="目的、現在困っていること、実現したいことなど"></textarea></label><label>希望する機能<textarea id="features" maxlength="10000" placeholder="例：ログイン、チーム管理、ランキング、管理者画面など"></textarea></label><label>参考サイト・資料・URL<textarea id="reference_urls" maxlength="5000" placeholder="URLを1行ずつ入力してください"></textarea></label></section><section><h2>03 / SCHEDULE & BUDGET</h2><div class="grid"><label>希望納期<input id="deadline" type="date"></label><label>予算<select id="budget"><option value="">未定・相談したい</option><option>〜1万円</option><option>1〜3万円</option><option>3〜5万円</option><option>5〜10万円</option><option>10万円以上</option></select></label></div><label class="check"><input id="urgent" type="checkbox"> 急ぎの案件である</label><label>素材の有無<select id="materials"><option>素材あり</option><option>一部あり</option><option>素材なし・相談したい</option></select></label><label>その他<textarea id="notes" maxlength="5000"></textarea></label></section><label class="check"><input id="agree" type="checkbox" required> 依頼内容を確認し、vocalink-teamからの連絡に同意します。 *</label><button id="submit" type="submit">依頼を送信する <b>→</b></button><div id="message" role="status"></div></form></main><script src="request-config.js?v=1.0.0"></script><script>const f=document.querySelector('#requestForm'),b=document.querySelector('#submit'),m=document.querySelector('#message');const v=id=>document.querySelector('#'+id).value.trim();f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;m.className='';m.textContent='送信中…';const p={name:v('name'),organization:v('organization')||null,email:v('email'),phone:v('phone')||null,contact_method:v('contact_method'),category:v('category'),title:v('title'),description:v('description'),features:v('features')||null,reference_urls:v('reference_urls')||null,deadline:v('deadline')||null,urgent:document.querySelector('#urgent').checked,budget:v('budget')||null,materials:v('materials')||null,notes:v('notes')||null};const {error}=await supabaseClient.from('service_requests').insert(p);b.disabled=false;if(error){console.error(error);m.className='error';m.textContent='送信に失敗しました。時間をおいて再度お試しください。';return}f.reset();m.className='ok';m.textContent='依頼を受け付けました。内容を確認後、ご連絡します。';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});</script></body></html>
